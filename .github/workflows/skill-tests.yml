name: Skill tests
on:
  push:
    paths:
      - '.claude/skills/**'
      - '.agents/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.gitattributes'
      - '.github/workflows/skill-tests.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: skill-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out symlinks and long paths on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # some checks compare with earlier versions of a note
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: uv sync --locked
      - run: uv run --locked playwright install chromium
      - run: uv run --locked python scripts/run_tests.py
