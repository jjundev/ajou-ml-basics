<article class="card" id="p1" data-source="MML Example 9.1"><h3>P1. 한글 수식</h3><div class="problem"><div class="conditions">조건 $a=1$ &amp; $b=5$.</div><div class="ask">$a/b$를 구하세요.</div></div><details class="original"><summary>원문</summary>Find the ratio.</details><details class="hint"><summary>힌트</summary>나눗셈.</details><details class="solution"><summary>풀이</summary><ol class="steps"><li>첫 단계 $a/b$.</li><li>둘째 단계 $1/5$.</li></ol><p class="answer">정답 $\frac{1}{5}$ ANSWER_ONLY_SENTINEL</p></details></article>
