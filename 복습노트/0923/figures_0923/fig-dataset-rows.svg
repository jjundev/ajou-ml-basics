<svg xmlns="http://www.w3.org/2000/svg" width="340" height="190" viewBox="0 0 340 190" role="img" aria-label="테두리 사각형이 세 줄 있어요. 줄마다 왼쪽 칸은 문제, 오른쪽 칸은 그 정답이고 두 칸이 선으로 이어져 있어요."><style>
