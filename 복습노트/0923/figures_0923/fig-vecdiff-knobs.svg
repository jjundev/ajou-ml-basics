<svg xmlns="http://www.w3.org/2000/svg" width="420" height="160" viewBox="0 0 420 160" role="img" aria-label="테두리 원으로 그린 손잡이 세 개가 점수 상자 하나로 이어지고, 아래에 손잡이마다 점수 변화를 적은 칸 세 개가 한 줄로 놓여 있어요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
