<svg xmlns="http://www.w3.org/2000/svg" width="330" height="160" viewBox="0 0 330 160" role="img" aria-label="모양이 같은 종 모양 선 세 개가 나란히 있고 사이에 곱하기라고 적혀 있어요. 아래 괄호 선이 셋을 묶어 모두 함께 나올 가능성을 가리켜요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
