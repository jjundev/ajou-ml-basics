<svg xmlns="http://www.w3.org/2000/svg" width="350" height="170" viewBox="0 0 350 170" role="img" aria-label="왼쪽에는 0을 가운데로 하는 종 모양 선이 있고, 오른쪽에는 0에서 오른쪽으로 비켜 선 종 모양 선이 있어요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
