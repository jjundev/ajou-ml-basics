<svg xmlns="http://www.w3.org/2000/svg" width="360" height="150" viewBox="0 0 360 150" role="img" aria-label="재료 하나 상자에서 그대로, 두 번 곱하기, 세 번 곱하기 세 상자로 갈라진 뒤 곱해서 더하기 상자로 모여 결과가 나오는 흐름. 모든 상자는 테두리만 있다"><style>
