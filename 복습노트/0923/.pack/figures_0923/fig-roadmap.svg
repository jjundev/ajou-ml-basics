<svg xmlns="http://www.w3.org/2000/svg" width="540" height="170" viewBox="0 0 540 170" role="img" aria-label="다섯 개의 테두리 상자가 왼쪽에서 오른쪽으로 이어진 길. 1번 문제 세우기와 2번 답 찾기 1 아래에 색칠된 점으로 오늘 배운 곳을 표시했고, 3번은 다음 시간, 4번은 그다음 주로 적혀 있다"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
