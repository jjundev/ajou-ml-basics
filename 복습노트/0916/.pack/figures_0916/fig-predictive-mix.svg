<svg xmlns="http://www.w3.org/2000/svg" width="540" height="200" viewBox="0 0 540 200" role="img" aria-label="왼쪽에 후보 다섯 개가 테두리 원으로 있고, 각 후보 아래 색칠된 막대 높이가 믿음의 크기를 나타낸다. 가운데가 가장 높다. 모든 후보에서 선이 모여 오른쪽 테두리 상자 &#x27;예측 하나&#x27;로 들어간다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
