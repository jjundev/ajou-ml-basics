<svg xmlns="http://www.w3.org/2000/svg" width="360" height="130" viewBox="0 0 360 130" role="img" aria-label="색칠된 점 다섯 개가 있는 세 칸 그림. 왼쪽은 모든 점을 지나는 꼬불꼬불한 선, 가운데는 점들과 동떨어진 납작한 직선, 오른쪽은 점들 사이를 부드럽게 지나는 곡선"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
