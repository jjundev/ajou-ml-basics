<svg xmlns="http://www.w3.org/2000/svg" width="360" height="110" viewBox="0 0 360 110" role="img" aria-label="가로 선 위 가운데 세로 눈금이 있고, 오른쪽의 색칠된 점이 물결선 고무줄로 가운데 눈금 쪽에 이어져 당겨지는 그림"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
