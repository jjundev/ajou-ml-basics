<svg xmlns="http://www.w3.org/2000/svg" width="360" height="120" viewBox="0 0 360 120" role="img" aria-label="왼쪽 테두리 상자 &#x27;손에 든 단서: 사진&#x27;에서 오른쪽 테두리 상자 &#x27;알고 싶은 것: 아픈지&#x27;로 선 화살표가 이어지는 그림"><style>
