<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240" role="img" aria-label="왼쪽에 3 곱하기 3 칸 표가 있고 칸마다 크기가 다른 색칠된 원이 들어 있어요. 표 위에는 &#x27;보이는 것&#x27;, 왼쪽에는 &#x27;숨은 핵심&#x27;이라고 적혀 있어요. 화살표 오른쪽에는 표를 세로로 더해 만든 테두리 막대 세 개가 있고 &#x27;보이는 것만 꺼내 봤어요&#x27;라고 적혀 있어요."><style>
