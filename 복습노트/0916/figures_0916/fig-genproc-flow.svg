<svg xmlns="http://www.w3.org/2000/svg" width="520" height="150" viewBox="0 0 520 150" role="img" aria-label="왼쪽 테두리 상자 &#x27;숨은 규칙&#x27;에서 화살표가 가운데 테두리 상자 &#x27;잡음(에어컨 소리)&#x27;을 거쳐 오른쪽 테두리 상자 &#x27;우리가 받은 데이터&#x27;로 이어지는 흐름도. 오른쪽 상자 안에는 색칠된 점 몇 개가 흩어져 있어요."><style>
