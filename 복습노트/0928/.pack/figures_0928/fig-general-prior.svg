<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" role="img" aria-label="왼쪽은 가운데 점에 중심을 둔 둥근 테두리 원, 오른쪽은 다른 자리의 점에 중심을 둔 비스듬한 타원 테두리. 두 중심점은 색칠된 점이다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="520" height="220" rx="10" fill="#ffffff"/>
      <line class="fig-muted" x1="20" y1="110" x2="240" y2="110" stroke-dasharray="4 4"/>
      <line class="fig-muted" x1="130" y1="20" x2="130" y2="190" stroke-dasharray="4 4"/>
      <circle class="fig-ink" cx="130" cy="110" r="60"/>
      <circle class="fig-ink" cx="130" cy="110" r="32"/>
      <circle class="fig-dot" cx="130" cy="110" r="5"/>
      <text class="fig-text" x="130" y="212" text-anchor="middle" font-size="13">가운데, 둥근 모양</text>
      <line class="fig-muted" x1="280" y1="110" x2="500" y2="110" stroke-dasharray="4 4"/>
      <line class="fig-muted" x1="390" y1="20" x2="390" y2="190" stroke-dasharray="4 4"/>
      <ellipse class="fig-accent" cx="430" cy="80" rx="62" ry="28" transform="rotate(-30 430 80)"/>
      <ellipse class="fig-accent" cx="430" cy="80" rx="34" ry="15" transform="rotate(-30 430 80)"/>
      <circle class="fig-dot" cx="430" cy="80" r="5"/>
      <text class="fig-text" x="390" y="212" text-anchor="middle" font-size="13">고른 자리, 고른 모양</text>
