<svg xmlns="http://www.w3.org/2000/svg" width="360" height="170" viewBox="0 0 360 170" role="img" aria-label="가운데 삼각형 받침 위에 가로 막대가 놓인 저울 그림. 왼쪽 접시에는 &#x27;데이터&#x27;, 오른쪽 접시에는 &#x27;원래 알던 상식&#x27;이 적혀 있고, 받침 아래에 &#x27;고른 답&#x27;이 적혀 있어요. 모두 선으로만 그렸어요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="360" height="170" rx="10" fill="#ffffff"/>
        <line x1="60" y1="50" x2="300" y2="50" class="fig-ink"/>
        <polygon points="180,50 160,110 200,110" class="fig-ink"/>
        <line x1="60" y1="50" x2="40" y2="90" class="fig-ink"/>
        <line x1="60" y1="50" x2="80" y2="90" class="fig-ink"/>
        <path d="M30 90 Q60 115 90 90 Z" class="fig-accent"/>
        <line x1="300" y1="50" x2="280" y2="90" class="fig-ink"/>
        <line x1="300" y1="50" x2="320" y2="90" class="fig-ink"/>
        <path d="M270 90 Q300 115 330 90 Z" class="fig-accent"/>
        <text x="60" y="135" text-anchor="middle" class="fig-text">데이터</text>
        <text x="300" y="135" text-anchor="middle" class="fig-text">원래 알던 상식</text>
        <text x="180" y="135" text-anchor="middle" class="fig-text">고른 답</text>
        <text x="180" y="30" text-anchor="middle" class="fig-muted">둘 다 무게를 가져요</text>
      </svg>
