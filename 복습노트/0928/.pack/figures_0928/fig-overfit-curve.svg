<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-label="가로축은 끈이 휘는 정도, 세로축은 틀린 정도이고, 연습 문제 선은 오른쪽으로 갈수록 계속 내려가며, 새 문제 선은 내려가다가 가운데쯤부터 다시 올라가고, 새 문제 선이 가장 낮은 곳에 색칠된 점이 있는 그림"><style>
