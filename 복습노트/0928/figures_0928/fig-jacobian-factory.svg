<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" role="img" aria-label="왼쪽의 재료 상자에서 선 세 개가 공장 1, 공장 2, 공장 3 테두리 상자로 이어지고, 각 공장 오른쪽에 테두리 칸 세 개짜리 가로줄이 있으며, 세 줄이 위아래로 쌓여 강조 선 테두리의 네모난 표 하나를 이루는 그림"><style>
