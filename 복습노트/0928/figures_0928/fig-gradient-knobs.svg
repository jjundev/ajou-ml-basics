<svg xmlns="http://www.w3.org/2000/svg" width="520" height="200" viewBox="0 0 520 200" role="img" aria-label="왼쪽에 손잡이 세 개가 테두리 원으로 세로로 놓여 있고, 오른쪽에는 각 손잡이에서 잰 변화가 테두리 칸 세 개로 가로 한 줄에 나란히 놓인 그림. 첫 번째 손잡이와 첫 번째 칸은 굵은 강조 선으로 그려져 있다"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
