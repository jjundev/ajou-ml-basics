<svg xmlns="http://www.w3.org/2000/svg" width="540" height="230" viewBox="0 0 540 230" role="img" aria-label="점선 테두리로 된 큰 상자 안에, 위쪽에 둘이 함께 일어남이라는 테두리 상자가 있고, 거기서 두 갈래 선이 아래의 테두리 상자 두 개로 이어지며, 아래 두 상자 사이에 곱하기라고 적힌 그림"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
