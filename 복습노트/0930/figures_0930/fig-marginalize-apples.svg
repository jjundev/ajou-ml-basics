<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" role="img" aria-label="위쪽에 사과 10개라고 적힌 테두리 상자가 있고, 거기서 나온 선 두 개가 아래쪽의 빨간 사과 6개, 초록 사과 4개라고 적힌 테두리 상자 두 개로 갈라지는 그림"><style>
