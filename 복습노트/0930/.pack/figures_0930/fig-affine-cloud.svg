<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-label="왼쪽에는 색칠된 점 일곱 개를 둥근 테두리 선이 감싸고 있고, 가운데의 곧은 선이 오른쪽을 가리키며, 오른쪽에는 같은 점들이 옆으로 넓게 벌어진 채 위쪽으로 옮겨져 길쭉한 테두리 선에 감싸여 있는 그림"><style>
