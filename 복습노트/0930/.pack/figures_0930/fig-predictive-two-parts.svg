<svg xmlns="http://www.w3.org/2000/svg" width="520" height="230" viewBox="0 0 520 230" role="img" aria-label="위쪽에 이 풀이법이면 답은 어떨까, 이 풀이법을 얼마나 믿을까라고 적힌 테두리 상자 두 개 사이에 곱하기라는 글자가 있고, 두 상자에서 내려온 선이 아래쪽의 모든 풀이법에 대해 모은 짐작이라고 적힌 테두리 상자로 모이는 그림"><style>
