<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230" role="img" aria-label="왼쪽에는 색칠된 점 여섯 개를 둥근 테두리 선이 감싸고 가운데에 엑스 표시가 있고, 가운데의 화살표 선이 오른쪽을 가리키며, 오른쪽에는 같은 점들이 옆으로 벌어진 채 위로 옮겨져 길쭉한 강조색 테두리 선에 감싸이고 가운데 엑스 표시도 함께 옮겨진 그림. 아래에 가운데 자리는 수업에서, 퍼진 모양은 숙제라고 적혀 있다"><style>
