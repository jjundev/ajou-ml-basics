            <circle cx="250" cy="94" r="5" class="fig-dot"/><text x="250" y="122" text-anchor="middle" class="fig-text">M_θ*</text><text x="250" y="138" text-anchor="middle" class="fig-muted">클래스 안의 최선</text>
            <line x1="256" y1="90" x2="418" y2="64" class="fig-danger" stroke-dasharray="6 5"/>
