<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewbox="0 0 520 250" role="img" aria-label="큰 원은 모델 클래스, 안쪽에서 초기 모델이 최선의 모델로 이동하고, 원 밖의 별(진짜 모델)과 빨간 점선 거리가 남는다"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="600" height="300" rx="10" fill="#ffffff"/>
            <circle cx="200" cy="135" r="100" class="fig-ink"/>
            <text x="200" y="22" text-anchor="middle" class="fig-text">모델 클래스 M_θ (예: linear)</text>
            <circle cx="140" cy="175" r="5" class="fig-dot"/><text x="140" y="200" text-anchor="middle" class="fig-text">M_θ₀</text><text x="140" y="216" text-anchor="middle" class="fig-muted">초기값</text>
            <line x1="146" y1="169" x2="244" y2="98" class="fig-accent"/><polyline points="234,99 244,98 240,108" class="fig-accent"/>
