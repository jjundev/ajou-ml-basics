<svg xmlns="http://www.w3.org/2000/svg" width="380" height="160" viewBox="0 0 380 160" role="img" aria-label="양팔 저울이에요. 왼쪽 접시에 모델1 점수, 오른쪽 접시에 모델2 점수가 있고, 왼쪽이 더 무거워 내려가 있어요. 가운데 받침은 색칠된 삼각형이에요."><style>
