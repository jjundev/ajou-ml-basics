<svg xmlns="http://www.w3.org/2000/svg" width="420" height="110" viewBox="0 0 420 110" role="img" aria-label="문제 100개를 공부용 60개, 연습 시험 20개, 진짜 시험 20개로 나눈 테두리 막대. 진짜 시험 칸만 색칠되어 있어요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
