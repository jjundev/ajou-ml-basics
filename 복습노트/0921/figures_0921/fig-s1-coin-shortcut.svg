<svg xmlns="http://www.w3.org/2000/svg" width="520" height="190" viewBox="0 0 520 190" role="img" aria-label="왼쪽에 지난 다섯 번의 결과 원 다섯 개, 가운데에 동전 성질 상자, 오른쪽에 다음 던지기 상자가 있어요. 기록에서 성질 상자를 거쳐 다음 던지기로 화살표가 이어지고, 기록에서 다음 던지기로 바로 가는 점선에는 가위표가 있어요."><style>
