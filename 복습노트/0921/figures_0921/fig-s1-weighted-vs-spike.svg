<svg xmlns="http://www.w3.org/2000/svg" width="520" height="200" viewBox="0 0 520 200" role="img" aria-label="왼쪽 그림에는 높이가 다른 테두리 막대 일곱 개가 나란히 있어 모든 후보를 믿는 만큼 섞는 모습이에요. 오른쪽 그림에는 색칠된 막대 하나만 높이 솟아 한 후보에 믿음을 모두 건 모습이에요."><style>
