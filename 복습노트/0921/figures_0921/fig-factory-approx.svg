<svg xmlns="http://www.w3.org/2000/svg" width="400" height="170" viewBox="0 0 400 170" role="img" aria-label="위 줄은 색칠된 점 다섯 개인 기록이 선 화살표로 곧장 답 상자에 이어진다. 아래 줄은 같은 기록이 테두리 상자인 공장을 거쳐 색칠된 점 하나가 된 뒤 답 상자로 이어진다."><style>
