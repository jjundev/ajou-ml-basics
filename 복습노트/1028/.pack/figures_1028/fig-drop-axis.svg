<svg xmlns="http://www.w3.org/2000/svg" width="380" height="170" viewBox="0 0 380 170" role="img" aria-label="왼쪽에는 가로로 넓게 퍼지고 위아래로 조금씩 흔들린 색칠된 점들이 있고, 화살표 오른쪽에는 같은 점들이 모두 한 가로선 위에 같은 높이로 놓여 있어요"><style>
