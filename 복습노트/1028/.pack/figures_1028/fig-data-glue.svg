<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" font-size="12" role="img" aria-label="세로로 긴 테두리 카드 세 장이 옆으로 붙어 큰 표 하나가 되고, 화살표를 따라 네 칸짜리 작은 정사각형 테두리 표로 요약되는 흐름이에요."><style>
