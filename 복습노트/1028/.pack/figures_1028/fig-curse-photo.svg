<svg xmlns="http://www.w3.org/2000/svg" width="360" height="150" viewBox="0 0 360 150" role="img" aria-label="왼쪽의 큰 테두리 사각형 사진이 화살표를 따라 오른쪽의 작은 테두리 사각형 사진으로 줄어들고, 두 사진 모두 안에 산과 해 모양 선이 그대로 있어요"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
