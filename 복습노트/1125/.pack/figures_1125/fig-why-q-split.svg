<svg xmlns="http://www.w3.org/2000/svg" width="340" height="150" viewBox="0 0 340 150" role="img" aria-label="가운데 색칠된 점에서 왼쪽 &#x27;가 반&#x27; 테두리 상자로 굵은 선이, 오른쪽 &#x27;나 반&#x27; 테두리 상자로 가는 선이 이어진 그림. 굵은 선 옆에는 3분의 2, 가는 선 옆에는 3분의 1이 적혀 있다."><style>
