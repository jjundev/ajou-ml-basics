<svg xmlns="http://www.w3.org/2000/svg" width="340" height="200" viewBox="0 0 340 200" role="img" aria-label="위쪽 가로선 위 왼쪽과 오른쪽에 테두리 원 두 개가 있고, 왼쪽 원에 더 가까운 자리에 색칠된 점 하나가 있어요. 아래에는 같은 길이의 테두리 막대 네 개가 있고, 아래 막대일수록 왼쪽부터 색칠된 부분이 길어져 마지막 막대는 끝까지 채워져 있어요. 막대들 가운데에 절반을 표시한 점선이 있어요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
