<svg xmlns="http://www.w3.org/2000/svg" width="560" height="180" viewBox="0 0 560 180" font-size="14" role="img" aria-label="세 가지 설정의 설명을 서로 다른 크기의 점으로 표시하고 한 상자에 모아 두 설명 방법을 비교하는 그림"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
