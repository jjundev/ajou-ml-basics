<svg xmlns="http://www.w3.org/2000/svg" width="420" height="150" viewBox="0 0 420 150" role="img" aria-label="왼쪽 테두리 상자는 연습한 사진들, 오른쪽 테두리 상자는 처음 보는 사진이고, 선 화살표가 둘을 잇는 그림. 오른쪽 상자 아래에 잘 맞혔다는 글이 있어요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="420" height="150" rx="10" fill="#ffffff"/>
            <rect x="20" y="30" width="140" height="80" rx="10" class="fig-ink"/>
            <text x="90" y="65" text-anchor="middle" class="fig-text">연습한 사진들</text>
            <text x="90" y="88" text-anchor="middle" class="fig-muted">많이 보여 줘요</text>
            <line x1="170" y1="70" x2="250" y2="70" class="fig-ink"/>
            <polyline points="240,62 250,70 240,78" class="fig-ink"/>
            <rect x="260" y="30" width="140" height="80" rx="10" class="fig-accent"/>
            <text x="330" y="65" text-anchor="middle" class="fig-text">처음 보는 사진</text>
            <text x="330" y="88" text-anchor="middle" class="fig-muted">여기서 잘해야 해요</text>
            <text x="330" y="135" text-anchor="middle" class="fig-text">잘 맞혔나요?</text>
          </svg>
