<svg xmlns="http://www.w3.org/2000/svg" width="420" height="180" viewBox="0 0 420 180" role="img" aria-label="그릇 모양 곡선 위에 색칠된 작은 점이 고르게 촘촘히 찍혀 있고, 점마다 하나씩 다 재 봐야 가장 낮은 바닥을 찾는다는 그림."><style>
