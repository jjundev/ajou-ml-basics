<svg xmlns="http://www.w3.org/2000/svg" width="420" height="180" viewBox="0 0 420 180" role="img" aria-label="왼쪽 아래에서 오른쪽 위로 올라가는 계단 모양 선이 있어요. 계단 칸마다 인터넷, 휴대폰, 많은 자료, 빠른 계산이라고 적혀 있고, 가로 점선 위로 올라선 마지막 칸에 색칠된 점이 있어요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
