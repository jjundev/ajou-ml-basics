<svg xmlns="http://www.w3.org/2000/svg" width="340" height="114" viewBox="0 0 340 114" role="img" aria-label="중심은 같고 퍼지는 방향이 서로 다른 두 등고선"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
