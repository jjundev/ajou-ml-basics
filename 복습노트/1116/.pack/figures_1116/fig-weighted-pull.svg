<svg xmlns="http://www.w3.org/2000/svg" width="340" height="120" viewBox="0 0 340 120" role="img" aria-label="수직선 왼쪽에 색칠된 점 네 개, 오른쪽 멀리 테두리만 있는 원 하나, 왼쪽 무리 가운데의 선 하나와 그보다 오른쪽으로 옮겨 간 강조선 하나"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
