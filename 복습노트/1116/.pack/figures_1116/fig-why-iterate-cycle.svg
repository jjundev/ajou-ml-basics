<svg xmlns="http://www.w3.org/2000/svg" width="340" height="130" viewBox="0 0 340 130" role="img" aria-label="왼쪽 ‘몫 나누기’ 테두리 상자와 오른쪽 ‘중심 옮기기’ 테두리 상자를 위아래 두 곡선 화살표가 번갈아 잇는 순환 그림"><style>
