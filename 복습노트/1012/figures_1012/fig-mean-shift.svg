<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220" role="img" aria-label="왼쪽에는 색칠된 점 다섯 개를 둥근 테두리 선이 감싸고 가운데에 엑스 표시가 있다. 가운데 화살표 선이 오른쪽을 가리키고, 오른쪽에는 같은 점들이 옆으로 벌어진 채 위로 옮겨져 길쭉한 강조색 테두리 선에 감싸여 있으며 엑스 표시도 그 가운데로 함께 옮겨져 있다"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
