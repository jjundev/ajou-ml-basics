<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-label="위쪽 줄에는 색칠된 점 네 개를 감싼 작은 둥근 테두리 선이 화살표 선을 따라 오른쪽의 넓고 길쭉한 강조색 테두리 선으로 바뀌고, 점들도 넓게 벌어져 있다. 아래쪽 줄에는 같은 작은 둥근 테두리 선이 화살표 선을 따라 오른쪽으로 옮겨지는데 크기와 점 사이 간격은 그대로다"><style>
