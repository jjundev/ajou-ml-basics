<svg xmlns="http://www.w3.org/2000/svg" width="540" height="250" viewBox="0 0 540 250" role="img" aria-label="위: 전체 문제 100을 공부용 60, 모의고사용 20, 시험용 20으로 나눈 막대. 아래: 공부용과 모의고사용을 합친 80을 20씩 네 조각으로 나누고, 채운 조각(모의고사용)의 자리를 회차마다 바꾸는 그림"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
