<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220" role="img" aria-label="가운데 앞면 확률에서 지난 동전 결과 H, T, T, T, H 다섯 개와 다음 던지기로 선이 나간다. 지난 결과에서 다음 던지기로 가는 점선에는 가위표가 있어, 앞면 확률을 알면 지난 결과가 필요 없음을 보인다"><style>
