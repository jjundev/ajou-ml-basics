<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200" role="img" aria-label="a에서 b와 c로, b에서 c로 가는 화살표 세 개가 있는 삼각형 방향 그래프"><style>
