<svg xmlns="http://www.w3.org/2000/svg" width="540" height="210" viewBox="0 0 540 210" role="img" aria-label="아래로 볼록한 오차 그릇에서 옆면의 구슬은 기울기가 있어 굴러가고, 바닥의 구슬은 기울기가 0이라 멈춘다"><style>
