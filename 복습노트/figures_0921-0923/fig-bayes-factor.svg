<svg xmlns="http://www.w3.org/2000/svg" width="540" height="190" viewBox="0 0 540 190" role="img" aria-label="처음 기대 비율과 설명력 비율을 곱하면 최종 비율이 되고, 최종 비율이 1보다 크면 첫째, 1 이하면 둘째를 고른다"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
