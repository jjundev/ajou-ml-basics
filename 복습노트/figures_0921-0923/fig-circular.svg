<svg xmlns="http://www.w3.org/2000/svg" width="540" height="230" viewBox="0 0 540 230" role="img" aria-label="왼쪽 올바른 순서: 짐작한다, 예측해 본다, 잘 맞으면 그럴 가능성이 있다. 오른쪽 빨간 고리: 데이터를 직선으로 만들고 직선 규칙을 쓰고 잘 맞는다며 다시 데이터가 직선이라고 주장하는 순환"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="540" height="230" rx="10" fill="#ffffff"/>
            <text x="120" y="18" text-anchor="middle" class="fig-text">올바른 순서</text>
            <rect x="30" y="32" width="180" height="40" rx="8" class="fig-accent"/><text x="120" y="57" text-anchor="middle" class="fig-text">"직선 규칙일 거야" (짐작)</text>
            <line x1="120" y1="74" x2="120" y2="96" class="fig-ink"/><polyline points="115,89 120,96 125,89" class="fig-ink"/>
            <rect x="30" y="100" width="180" height="40" rx="8" class="fig-ink"/><text x="120" y="125" text-anchor="middle" class="fig-text">새 데이터로 예측해 봄</text>
            <line x1="120" y1="142" x2="120" y2="164" class="fig-ink"/><polyline points="115,157 120,164 125,157" class="fig-ink"/>
            <rect x="30" y="168" width="180" height="40" rx="8" class="fig-ink"/><text x="120" y="193" text-anchor="middle" class="fig-text">잘 맞음 → 그럴 가능성 있음</text>
            <text x="120" y="224" text-anchor="middle" class="fig-muted">진짜 그런지는 아무도 몰라요</text>
            <line x1="250" y1="10" x2="250" y2="220" class="fig-ink" stroke-dasharray="4 5"/>
            <text x="395" y="18" text-anchor="middle" class="fig-text">빙글빙글 도는 말 (순환)</text>
            <circle cx="395" cy="120" r="72" class="fig-danger" stroke-dasharray="8 6"/>
