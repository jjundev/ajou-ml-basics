<svg xmlns="http://www.w3.org/2000/svg" width="360" height="170" viewBox="0 0 360 170" role="img" aria-label="가로줄 위에 색칠된 점 다섯 개가 가운데에 모여 있어요. 점들 바로 위에 선으로 그린 종 모양이 있고, 오른쪽으로 비켜난 곳에 선으로 그린 다른 종 모양이 있어요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
