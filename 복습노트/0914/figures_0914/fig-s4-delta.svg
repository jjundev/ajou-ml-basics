<svg xmlns="http://www.w3.org/2000/svg" width="360" height="170" viewBox="0 0 360 170" role="img" aria-label="선으로 그린 종 모양 세 개가 왼쪽부터 넓게, 조금 좁게, 아주 좁게 그려져 있고, 맨 오른쪽에는 한 점에 선 높은 막대 선이 있어요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
