<svg xmlns="http://www.w3.org/2000/svg" width="360" height="170" viewBox="0 0 360 170" role="img" aria-label="왼쪽은 입력 상자에서 선을 따라 색칠된 점 하나로 가는 그림으로 답이 하나예요. 오른쪽은 입력 상자에서 종 모양 곡선 테두리로 가는 그림으로 답이 퍼져 있어요."><style>
