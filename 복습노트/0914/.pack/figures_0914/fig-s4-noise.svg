<svg xmlns="http://www.w3.org/2000/svg" width="360" height="190" viewBox="0 0 360 190" role="img" aria-label="비스듬한 곧은 선이 있고 그 둘레에 색칠된 점들이 흩어져 있어요. 점마다 선까지 짧은 세로 선이 이어져 있고, 선 위 세 곳에 옆으로 누운 종 모양이 선으로 그려져 있어요."><style>
