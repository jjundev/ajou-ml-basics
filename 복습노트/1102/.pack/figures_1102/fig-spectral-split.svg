<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200" role="img" aria-label="왼쪽에 칸이 3줄 3칸인 큰 테두리 표가 있고, 왼쪽 위에서 오른쪽 아래로 접는 강조색 점선이 그어져 있어요. 등호 뒤에 크기가 점점 작아지는 테두리 상자 세 개가 더하기로 이어져요. 세 작은 상자 안에는 방향이 서로 다른 선이 하나씩 그어져 있고, 가장 큰 조각의 상자와 선은 강조색이에요."><style>
