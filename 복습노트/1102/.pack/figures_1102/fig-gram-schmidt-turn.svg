<svg xmlns="http://www.w3.org/2000/svg" width="640" height="210" viewBox="0 0 640 210" role="img" aria-label="왼쪽 그림에는 한 점에서 출발한 두 선이 비스듬한 각도로 벌어져 있어요. 가운데 화살표 선이 오른쪽 그림을 가리켜요. 오른쪽 그림에서는 첫 선은 그대로이고, 둘째 선이 강조색 선으로 바뀌어 첫 선과 직각을 이루며, 꼭짓점에 작은 직각 표시가 있어요."><style>
