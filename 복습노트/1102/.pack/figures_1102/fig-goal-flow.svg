<svg xmlns="http://www.w3.org/2000/svg" width="560" height="150" viewBox="0 0 560 150" role="img" aria-label="네 개의 테두리 상자가 화살표로 이어진 흐름도: 많은 숫자, 퍼짐 표 만들기, 넓게 퍼진 방향부터 줄 세우기, 앞에서 몇 개만 남기기"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="560" height="150" rx="10" fill="#ffffff"/>
<rect class="fig-ink" x="8" y="45" width="110" height="60" rx="8"/><text class="fig-text" x="63" y="80" text-anchor="middle">많은 숫자</text>
<line class="fig-ink" x1="118" y1="75" x2="146" y2="75"/><polyline class="fig-ink" points="139,69 146,75 139,81"/>
<rect class="fig-ink" x="148" y="45" width="118" height="60" rx="8"/><text class="fig-text" x="207" y="80" text-anchor="middle">퍼짐 표 만들기</text>
<line class="fig-ink" x1="266" y1="75" x2="294" y2="75"/><polyline class="fig-ink" points="287,69 294,75 287,81"/>
<rect class="fig-accent" x="296" y="35" width="128" height="80" rx="8"/><text class="fig-text" x="360" y="70" text-anchor="middle">넓게 퍼진 방향</text><text class="fig-text" x="360" y="90" text-anchor="middle">부터 줄 세우기</text>
<line class="fig-ink" x1="424" y1="75" x2="440" y2="75"/><polyline class="fig-ink" points="433,69 440,75 433,81"/>
<rect class="fig-ink" x="442" y="45" width="110" height="60" rx="8"/><text class="fig-text" x="497" y="70" text-anchor="middle">앞에서</text><text class="fig-text" x="497" y="90" text-anchor="middle">몇 개만 남기기</text>
</svg>
