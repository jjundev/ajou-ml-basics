<svg xmlns="http://www.w3.org/2000/svg" width="380" height="175" viewBox="0 0 380 175" role="img" aria-label="가운데 테두리 상자 기계를 사이에 두고, 왼쪽에는 지나기 전 화살표 두 개, 오른쪽에는 지난 뒤 화살표 두 개가 있어요. 기본 선 화살표는 지난 뒤 방향이 왼쪽 위로 돌아가고, 강조색 선 화살표는 같은 방향 그대로 길이만 두 배가 돼요"><style>
